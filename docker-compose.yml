version: '3.3'

services:

  mail-gateway:
    build: .
    image: ghcr.io/mamama1/mail-gateway
    restart: always
    environment:
      MAIL_FQDN: mail-security-scanner-gateway
      RELAYHOST: mail02.internal.tld:25
      #POSTFIX_MESSAGE_SIZE_LIMIT: 10240000  # bytes, default is 10485760 (~10MB)
    volumes:
      - ./tls:/etc/postfix/tls:ro
      - ./additional:/etc/postfix/additional
    networks:
      - mail

networks:
  mail:
    driver: bridge
